<script>
// ▼ 매달 카탈로그가 바뀌면: catalog/ 폴더 이미지 교체 + 아래 값 수정

// ── 방문 기록 (이름 없이) → 구글 시트 "영업스타일테스트 로그" ──
// LOG_URL이 비어 있으면 아무것도 보내지 않아요 (미리보기용)
const LOG_URL = "https://script.google.com/macros/s/AKfycbyRLWrya231PRXCxbku1vG6jililfCAjooFO9VdbSg2DwSP6joAuAdVUtW6_xwpGn_P/exec";

const UA = navigator.userAgent;
const DEV = /iPhone|iPad|Android|Mobile/i.test(UA) ? "모바일" : "PC";
const KAKAO = /KAKAOTALK/i.test(UA);
const SRC = new URLSearchParams(location.search).get("from") || "";
const loggedPages = new Set();
function log(act, extra = {}) {
  if (!LOG_URL) return;
  const body = JSON.stringify({ vid: VID, act, dev: DEV, kakao: KAKAO, src: SRC, ...extra });
  try { fetch(LOG_URL, { method: "POST", mode: "no-cors", body, keepalive: true }); } catch (e) {}
}

// 축: 0 = 개척/소개, 1 = 마음/숫자, 2 = 관리/클로징
const AXES = [
  { a: "개척", b: "소개" },

const QUESTIONS = [

  { axis: 2, e: "🤔", q: "고객님이 \"한번 생각해볼게요\" 하셨어요.", a: "다음 주에 안부 문자부터 보내요", b: "\"어떤 부분이 걸리세요? 지금 같이 보실까요?\"" },
  { axis: 0, e: "🎪", q: "아는 사람이 거의 없는 행사장에 갔어요.", a: "명함 20장은 뿌리고 와요", b: "아는 분 옆에 붙어서 자연스럽게 소개받아요" },
  { axis: 1, e: "🌙", q: "상담 전날 밤, 내가 챙기는 건?", a: "고객님 근황, 가족 이야기, 지난번 대화 메모", b: "보장분석표랑 비교 설계안 3개" },
  { axis: 2, e: "📅", q: "내 휴대폰 캘린더를 열어보면?", a: "고객님 생일, 결혼기념일로 빼곡해요", b: "이번 주 청약 일정이 제일 크게 적혀 있어요" },

const app = document.getElementById("app");

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function renderQuestion() {
  const i = state.step, Q = QUESTIONS[i];
  const pct = Math.round((i / QUESTIONS.length) * 100);
  app.innerHTML = `
    <div class="top">
      <button class="back" id="back" aria-label="${i ? "이전 질문" : "처음으로"}">‹</button>

      <h2 class="q-title">${esc(Q.q)}</h2>
    </section>

      <button class="answer" data-v="a">${esc(Q.a)}</button>
      <button class="answer" data-v="b">${esc(Q.b)}</button>
    </div>`;
  app.querySelectorAll(".answer").forEach(btn => btn.onclick = () => {
    btn.classList.add("picked");
    state.picks[i] = btn.dataset.v;
    setTimeout(() => {
      if (i + 1 < QUESTIONS.length) { state.step++; renderQuestion(); }
      else renderLoading();
    }, 180);
  });
  document.getElementById("back").onclick = () => {
    if (i === 0) renderIntro(); else { state.step--; renderQuestion(); }
  };
  window.scrollTo(0, 0);
}

function score() {
  // 축마다 A 선택 비율. 2:2 동점이면 그 축 첫 질문의 답을 따라요
  return AXES.map((_, ax) => {
    const idx = QUESTIONS.map((q, k) => q.axis === ax ? k : -1).filter(k => k >= 0);
    const ratio = idx.filter(k => state.picks[k] === "a").length / idx.length;
    const isA = ratio > 0.5 || (ratio === 0.5 && state.picks[idx[0]] === "a");
    return { ratio, isA };
  });
}
const codeOf = s => (s[0].isA ? "P" : "R") + (s[1].isA ? "H" : "D") + (s[2].isA ? "M" : "K");
function flip(code, positions) {
  const pairs = [["P", "R"], ["H", "D"], ["M", "K"]];
  return code.split("").map((c, k) => positions.includes(k) ? (pairs[k][0] === c ? pairs[k][1] : pairs[k][0]) : c).join("");
}

// 찰떡: 마음↔숫자만 반대 (같은 방식으로 일하되 설득을 서로 보완)
function bestWhy(code) {
  return code[1] === "H"
    ? "영업 방식은 나랑 같은데, 설득은 숫자로 해요. 내가 마음을 열어두면 이 동료가 비교표로 확신을 더해줘요. 둘이 같이 상담 들어가면 계약률이 쑥 올라가요!"
    : "영업 방식은 나랑 같은데, 설득은 마음으로 해요. 내가 숫자로 설명하면 이 동료가 고객님 마음을 움직여줘요. 둘이 같이 상담 들어가면 계약률이 쑥 올라가요!";
}
// 상극: 세 축 모두 반대
function worstWhy(code) {
  const me = [code[0] === "P" ? "개척" : "소개", code[1] === "H" ? "마음" : "숫자", code[2] === "M" ? "관리" : "클로징"];
  const you = [code[0] === "P" ? "소개" : "개척", code[1] === "H" ? "숫자" : "마음", code[2] === "M" ? "클로징" : "관리"];
  return `나는 ${me.join("·")}, 이 동료는 ${you.join("·")}. 하나부터 열까지 정반대라 같이 상담 가면 서로 답답할 수 있어요. 대신 서로한테 배울 게 제일 많은 사이예요.`;
}

  vImg.alt = `${CATALOG_NAME} ${vPage}쪽`;
  document.getElementById("v-num").textContent = `${vPage} / ${CATALOG_PAGES}`;
  document.getElementById("v-prev").disabled = vPage === 1;
  document.getElementById("v-next").disabled = vPage === CATALOG_PAGES;
  vScroll.scrollTo(0, 0);
  [vPage - 1, vPage + 1].forEach(k => { if (k >= 1 && k <= CATALOG_PAGES) new Image().src = pageSrc(k); });
  // 같은 방문에서 같은 쪽은 한 번만 기록
  if (!loggedPages.has(vPage)) { loggedPages.add(vPage); log("카탈로그 열람", { page: vPage, item: giftOnPage(vPage) }); }
}
function giftOnPage(n) { return Object.values(TYPES).filter(t => t.gift.page === n).map(t => t.gift.name).join(", "); }
function setZoom(z) { vZoom = z; V.classList.toggle("zoomed", z); document.getElementById("v-zoom").textContent = z ? "축소" : "확대"; }
function openCatalog(n) {
  lastFocus = document.activeElement;
  setZoom(false); showPage(n);
  V.hidden = false; document.body.style.overflow = "hidden";
  document.getElementById("v-close").focus();
}
function closeCatalog() { V.hidden = true; document.body.style.overflow = ""; lastFocus?.focus(); }
document.getElementById("v-close").onclick = closeCatalog;
document.getElementById("v-prev").onclick = () => showPage(vPage - 1);
document.getElementById("v-next").onclick = () => showPage(vPage + 1);
document.getElementById("v-toc").onclick = () => showPage(CATALOG_TOC);
document.getElementById("v-zoom").onclick = () => setZoom(!vZoom);
vImg.addEventListener("dblclick", () => setZoom(!vZoom));
document.addEventListener("keydown", e => {
  if (V.hidden) return;
  if (e.key === "Escape") closeCatalog();
  if (e.key === "ArrowLeft") showPage(vPage - 1);
  if (e.key === "ArrowRight") showPage(vPage + 1);
});
let tx = null, ty = null;
vScroll.addEventListener("touchstart", e => { if (e.touches.length === 1) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; } else tx = null; }, { passive: true });
vScroll.addEventListener("touchend", e => {
  if (tx === null || vZoom) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) showPage(vPage + (dx < 0 ? 1 : -1));
  tx = null;
});
document.getElementById("v-title").textContent = CATALOG_NAME;
document.getElementById("v-tel").textContent = PHONE;

renderIntro();
log("입장");
</script>
